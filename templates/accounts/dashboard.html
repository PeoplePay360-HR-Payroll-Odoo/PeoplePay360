{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | PeoplePay360</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Dashboard CSS -->
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>

<body>

    <!-- ================= NAVBAR ================= -->
    <nav class="navbar navbar-expand-lg dash-navbar sticky-top px-3 px-lg-4">
        <div class="container-fluid">
            <!-- Brand -->
            <a href="{% url 'dashboard' %}" class="navbar-brand d-flex align-items-center gap-2 text-white fw-bold">
                <div class="brand-icon">
                    <i class="bi bi-people-fill"></i>
                </div>
                <span>PeoplePay<span class="text-primary">360</span></span>
            </a>

            <!-- Toggle Button -->
            <button class="navbar-toggler border-0 text-white" type="button" data-bs-toggle="collapse" data-bs-target="#dashNav">
                <i class="bi bi-list fs-2"></i>
            </button>

            <!-- Links & Profile -->
            <div class="collapse navbar-collapse" id="dashNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-lg-2">
                    <li class="nav-item">
                        <a class="nav-link text-white fw-semibold active" href="{% url 'dashboard' %}">
                            <i class="bi bi-speedometer2 me-1"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-secondary" href="{% url 'landing' %}">
                            <i class="bi bi-house-door me-1"></i> Home Page
                        </a>
                    </li>
                </ul>

                <!-- User Account Info -->
                <div class="d-flex align-items-center gap-3">
                    <div class="text-end d-none d-md-block">
                        <div class="fw-bold text-white small">{{ user.first_name|default:user.username }}</div>
                        <div class="text-secondary" style="font-size: 0.75rem;">{{ user.email }}</div>
                    </div>

                    <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm rounded-pill px-3">
                        <i class="bi bi-box-arrow-right me-1"></i> Sign Out
                    </a>
                </div>
            </div>
        </div>
    </nav>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PeoplePay360{% endblock %}</title>
    <!-- Bootstrap CSS (Dark mode compatible) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #e2e8f0;
            --muted-text: #94a3b8;
            --border-color: #334155;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --active-indicator: #10b981;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* Top Navigation Bar */
        .top-navbar {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 0 1rem;
            display: flex;
            align-items: center;
            height: 56px;
        }

        .nav-app-icon {
            background-color: var(--border-color);
            color: #fff;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            margin-right: 1.5rem;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .top-navbar a {
            color: var(--muted-text);
            text-decoration: none;
            padding: 0.5rem 1rem;
            font-size: 0.95rem;
            display: inline-block;
            transition: color 0.2s;
        }

        .top-navbar a:hover {
            color: var(--text-color);
        }

        .top-navbar a.active {
            color: var(--text-color);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: calc(0.5rem - 2px);
        }
        
        /* General Utilities */
        .card-custom {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }
        
        .btn-primary-custom {
            background-color: var(--accent-color);
            border: none;
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 6px;
            font-weight: 500;
        }

        .btn-primary-custom:hover {
            background-color: var(--accent-hover);
            color: white;
        }
        
        .btn-secondary-custom {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.4rem 1.2rem;
            border-radius: 6px;
        }

        .btn-secondary-custom:hover, .btn-secondary-custom.active {
            background-color: var(--border-color);
            color: white;
        }

        .search-bar {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            padding: 0.4rem 1rem;
            min-width: 300px;
        }
        .search-bar:focus {
            outline: none;
            border-color: var(--accent-color);
            background-color: var(--bg-color);
            color: white;
        }

        .text-muted-custom {
            color: var(--muted-text) !important;
        }
        
        .badge-active {
            color: var(--active-indicator);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        
        .badge-active::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--active-indicator);
            border-radius: 50%;
        }

        /* Dark Mode Form Overrides */
        .form-control, .form-select {
            background-color: var(--bg-color);
            color: var(--text-color);
            border-color: var(--border-color);
        }
        .form-control:focus, .form-select:focus {
            background-color: var(--bg-color);
            color: #fff;
            border-color: var(--accent-color);
        }
        .form-control:disabled, .form-select:disabled,
        .form-control[disabled], .form-select[disabled],
        .form-control[readonly], .form-select[readonly] {
            background-color: rgba(15, 23, 42, 0.75) !important;
            color: #f1f5f9 !important;
            -webkit-text-fill-color: #f1f5f9 !important;
            border-color: var(--border-color) !important;
            opacity: 1 !important;
        }
        .form-select option, select option {
            background-color: var(--panel-bg);
            color: #f1f5f9;
        }

    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <div class="top-navbar">
        <div class="nav-app-icon">HR</div>
        <a href="{% url 'employee_list' %}" class="{% if 'employee' in request.resolver_match.url_name %}active{% endif %}">Employees</a>
        <a href="{% url 'working_schedule_list' %}" class="{% if 'working_schedule' in request.resolver_match.url_name %}active{% endif %}">Working Schedules</a>
        <a href="{% url 'contract_list' %}" class="{% if 'contract' in request.resolver_match.url_name %}active{% endif %}">Contracts</a>
        <a href="{% url 'attendance_list' %}" class="{% if 'attendance' in request.resolver_match.url_name %}active{% endif %}">Attendance</a>
        <a href="#">Time Off</a>
        <a href="#">Payroll</a>
    </div>

    <!-- Main Content -->
    <div class="container-fluid py-4 px-4">
        {% if messages %}
            <div class="mb-3">
                {% for message in messages %}
                    <div class="alert alert-{% if message.tags == 'error' %}danger{% elif message.tags %}{{ message.tags }}{% else %}info{% endif %} alert-dismissible fade show card-custom border-0 py-2 px-3 text-light" role="alert">
                        <i class="bi bi-info-circle me-2"></i>{{ message }}
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
